# ---- 插件基础信息 ----
pluginId=com.github.chargeduck.codecallmap.plugin
pluginName=CodeCall Map
pluginDescription=CodeCall Map - 开源的接口调用链路记录插件。以专用 Run/Debug 模式启动 Java 程序，通过 javaagent 自动插桩采集方法级调用链与每级耗时，时序图/瀑布图/耗时热点定位性能卡点。
pluginVendor=CodeCallMap Team

# ---- 版本号 ----
# 四段式：<大版本>.<新增功能>.<修复BUG>.<构建号>
#
#   pluginMajor     大版本   架构重构、不兼容变更、正式发版
#   pluginFeature   新增功能 新增一个用户可见的功能
#   pluginFix       修复BUG  修一个 bug
#   pluginBuild     构建号   每次 bump 都 +1，**永远不清零**
#
# 【递增规则】
#   修 bug    0.1.1.31 → 0.1.2.32   （修复号 +1，构建号继续累加）
#   加功能    0.1.1.31 → 0.2.0.32   （功能号 +1，修复号归零，构建号继续累加）
#   重构/发布  0.1.1.31 → 1.0.0.32   （大版本 +1，其余语义段归零，构建号继续累加）
#   仅重新打包 0.1.1.31 → 0.1.1.32   （只有构建号 +1）
#
# 【构建号为什么不清零】
# 它是"这是第几次构建"的单调流水号，不是语义段。
# 清零会出现 0.1.2.0 这种"第 0 次构建"，语义说不通，
# 且发布包文件名会与历史重名，无法区分批次。
#
# 【构建号禁止重置 —— 血泪教训 2026-10-20】
# 构建号等于"历史上累计发出过多少个构建"，只能从实际历史往上累加。
# 曾把 0.1.0.28 的 28 误改成 1，等于宣称"只构建过 1 次"，完全失真，
# 用户一眼就看出来不对。
#   正确溯源：0.1.0.28（构建号 28）→ 之后每提交一次 +1 → 31
# 改版本号前先 `git log` 数一遍，不要凭感觉填。
#
# 为什么必须严格递增：版本号是"用户装的是哪一版"的唯一凭据。
# 之前把前三段合成一个固定的 "0.1.0"，实际退化成只有最后一位在动 ——
# 0.1.0.22 明明是新功能、0.1.0.21 是策略重构，版本号却毫无体现。
#
# 发版流程（不要手改，用任务）：
#   ./gradlew bumpVersion -Pbump=fix|feat|major|build
#   ./gradlew packageRelease
#   → release/codeCallMap-<大.功能.修复.构建>-<分支>-<平台>.zip
pluginMajor=1
pluginFeature=0
pluginFix=1
pluginBuild=60

# 版本号后缀：本分支加 legacy
#
# support-233 与 support-253 代码一致、目标 IDEA 版本不同。
# 两者若用同一版本号，上传 JetBrains Marketplace 会被判为重复版本而拒绝。
# 因此 233 加 -legacy 后缀，最终版本为 1.0.1.60-legacy。
pluginVersionSuffix=legacy

# ---- IntelliJ Platform ----
# 平台类型：IC=Community / IU=Ultimate
#   master / support-233：IC 2025.2（since 233）
#   support-253：IU 2025.3.1（since 253，与 xechat 参考一致，Community 无 2025.3.1 发行）
platformType=IC
# 目标 IntelliJ 版本（master / support-233 = 2025.2；support-253 分支改为 2025.3.1）
platformVersion=2025.2
# 兼容版本下限（build 号，master / support-233 = 233；support-253 分支改为 253）
sinceBuild=233

# ---- 构建 ----
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# ---- runIde 开发期 Registry 配置 ----
# 这些值会在 prepareSandbox 阶段写入沙箱的
#   <sandbox>/<IDEVERSION>/config/options/ide.general.xml
# 的 <component name="Registry"> 里，等价于手工在 Registry 面板里设置。
#
# 为什么要自动化：手工设的值会随沙箱重建（clean / 换 IDE 版本 / 删目录）丢失，
# 每次都要重新点一遍，而且改完必须重启 IDE 才生效 —— 开发期非常打断节奏。
#
# JCEF 调试端口（让 Chrome 连上页面 Console）：
#   0 = 不写（交给 IDE 自己的默认行为）
jcefDebugPort=9222

# 其余开发期 JCEF 开关，逗号分隔的「键=值」。
# 键名必须是 IDE 真实存在的（见 build.gradle.kts 里的清单），
# 写错 IDE 会静默忽略，不会有任何提示。
#
#   contextMenu.devTools.enabled  右键菜单里的 Inspect 项
#   gpu.disable                   禁用 GPU 加速（排查渲染花屏/崩溃时用）
#   osr.enabled                   离屏渲染；开=true 才支持 DevTools 截图等功能
jcefRegistry=ide.browser.jcef.contextMenu.devTools.enabled=true,ide.browser.jcef.gpu.disable=true,ide.browser.jcef.osr.enabled=true
